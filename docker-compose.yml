services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models/yolo11n_v2.pt:/app/models/yolo11n_v2.pt:ro
    environment:
      MODEL_PATH: /app/models/yolo11n_v2.pt
      MODEL_VERSION: v2
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
